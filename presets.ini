version = 1

; basing DGX Spark options from https://github.com/ggml-org/llama.cpp/blob/master/benches/dgx-spark/dgx-spark.md
;Qwen3.6-27B-NVFP4-GGUF see `glow -p src/tools/server/README.md` for configuration options
[*]
flash-attn = on     ; defualt is auto (not needed?, or is this for misconfigured gguf?)
n-gpu-layers = -1   ; defualt is auto, changed for DGX Spark 
;mmap = false       ; default is true, changed for DGX Spark
load-mode = none    ; replaced no-mmap commit 153d324
fit = false         ; https://tinyurl.com/bderaebv | forums.developer.nvidia.com/ help-on-llama-cpp-comma... /357012/2
; parallel = 2
threads = 10        ; limit to 50% of the 20 CPUs
cache-ram = 0       ; https://tinyurl.com/722va4kj | forums.developer.nvidia.com glm 5.2 on 2x dgx spark ... /374523
metrics = on        ; Prometheus compatible metrics

; defaults for reference
; temperature = 0.8 
; top_p = 0.95
; repeat_penalty = 1.0 ; (1.0 = Disabled)
; dry_multiplier = 0.0 ; (0.0 = Disabled)


